name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variants:
          - runner: ubuntu-latest
            task: linux:package
          - runner: ubuntu-24.04-arm
            task: linux:package
          - runner: macos-latest
            task: darwin:package:universal
          - runner: windows-latest
            task: windows:build:native
    runs-on: ${{ matrix.variants.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v6
        with:
          go-version: ">=1.24"
          check-latest: true
      - name: Install System Dependencies
        if: matrix.variants.runner == 'ubuntu-latest' || matrix.variants.runner == 'ubuntu-24.04-arm'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libwebkitgtk-6.0-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Build Application
        run: wails3 task ${{ matrix.variants.task }}
        env:
          EXTRA_TAGS: gtk4
      - name: Build Application Windows ARM
        if: matrix.variants.runner == 'windows-latest'
        run: |
          mv bin\moonshot.exe bin\moonshot-x64.exe
          wails3 task ${{ matrix.variants.task }}
          mv bin\moonshot.exe bin\moonshot-arm64.exe
        env:
          GOARCH: arm64

      - uses: actions/upload-artifact@v6
        with:
          name: moonshot-${{ matrix.variants.runner }}
          path: bin

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Assemble release assets
        run: |
          mkdir -p release
          mv artifacts/moonshot-ubuntu-latest/moonshot release/moonshot-linux-x86_64
          mv artifacts/moonshot-ubuntu-latest/moonshot-x86_64.AppImage release/moonshot-x86_64.AppImage
          mv artifacts/moonshot-ubuntu-24.04-arm/moonshot release/moonshot-linux-aarch64
          mv artifacts/moonshot-ubuntu-24.04-arm/moonshot-aarch64.AppImage release/moonshot-aarch64.AppImage
          mv artifacts/moonshot-macos-latest/moonshot.app release/Moonshot.app
          mv artifacts/moonshot-windows-latest/moonshot-arm64.exe release/moonshot-arm64.exe
          mv artifacts/moonshot-windows-latest/moonshot-x64.exe release/moonshot-x64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
          make_latest: ${{ !(contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc')) }}
          generate_release_notes: true
          files: |
            artifacts/moonshot-ubuntu-latest/*
            artifacts/moonshot-ubuntu-24.04-arm/*
            artifacts/moonshot-macos-latest/*
            artifacts/moonshot-windows-latest/*
